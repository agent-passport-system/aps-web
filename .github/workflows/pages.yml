name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Check hidden files and discovery files before upload
        run: |
          set -eu
          # Every hidden path the artifact will carry. A new one fails the deploy until it is added here.
          expected='./.gitignore
          ./.nojekyll
          ./.well-known
          ./assets/aeoess/.gitkeep'
          expected=$(printf '%s\n' "$expected" | sed 's/^ *//' | sort)
          actual=$(find . -mindepth 1 \( -path ./.git -o -path ./.github \) -prune -o -name '.*' -print | sort)
          if [ "$actual" != "$expected" ]; then
            echo "Hidden paths differ from the allowlist:"; diff <(echo "$expected") <(echo "$actual") || true; exit 1
          fi
          for f in witness-1.json security.txt mcp.json agents.json aps.txt agent-trust.json aeoess-issuer.json; do
            test -s ".well-known/$f" || { echo "missing .well-known/$f"; exit 1; }
          done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: '.'
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Live .well-known files match the repository
        run: |
          set -eu
          for f in .well-known/*; do
            ok=no
            for i in 1 2 3 4 5 6; do
              if curl -fsS "https://agent-passport.org/$f?v=$GITHUB_SHA" -o /tmp/live && cmp -s /tmp/live "$f"; then ok=yes; break; fi
              sleep 15
            done
            [ "$ok" = yes ] || { echo "live $f is missing or differs from the repository"; exit 1; }
            echo "ok $f"
          done
