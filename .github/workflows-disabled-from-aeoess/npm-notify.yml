name: NPM Publish Notification
on:
  push:
    paths:
      - 'index.html'
      - 'passport.html'
      - 'llms.txt'
      - 'llms-full.txt'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name'
        required: true
      version:
        description: 'Version published'
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Email notification via Issue comment
        uses: actions/github-script@v7
        with:
          script: |
            // Only notify for propagation commits (from npm publish → postpublish hook)
            let pkg, version, source;
            if (context.eventName === 'workflow_dispatch') {
              pkg = context.payload.inputs.package;
              version = context.payload.inputs.version;
              source = 'manual trigger';
            } else {
              const msg = context.payload.head_commit?.message || '';
              if (!msg.toLowerCase().includes('propagate')) {
                console.log('Not a propagation commit, skipping');
                return;
              }
              const vMatch = msg.match(/v?(\d+\.\d+\.\d+)/);
              if (!vMatch) {
                console.log('No version found, skipping');
                return;
              }
              version = vMatch[1];
              pkg = msg.toLowerCase().includes('mcp')
                ? 'agent-passport-system-mcp'
                : 'agent-passport-system';
              source = 'npm publish → auto-propagation';
            }

            // Find or create the notification hub issue
            const hubTitle = '📡 AEOESS Notification Hub';
            const { data: search } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open "${hubTitle}" in:title`
            });

            let issueNumber;
            if (search.total_count > 0) {
              issueNumber = search.items[0].number;
            } else {
              const { data: created } = await github.rest.issues.create({
                ...context.repo,
                title: hubTitle,
                body: 'Automated notifications from AEOESS infrastructure.\n\n**Subscribe to this issue** (click "Subscribe" in the sidebar) to get email alerts for:\n- 🆕 New agent registrations\n- 📦 SDK/MCP npm publishes\n- 📣 New Agora governance messages\n\n> Do not close this issue.'
              });
              issueNumber = created.number;
              // Pin it
              try {
                await github.graphql(`mutation { pinIssue(input: {issueId: "${created.node_id}"}) { issue { id } } }`);
              } catch(e) { console.log('Could not pin issue:', e.message); }
            }

            const npmUrl = `https://www.npmjs.com/package/${pkg}`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issueNumber,
              body: `📦 **npm Package Published**\n\n| Field | Value |\n|-------|-------|\n| Package | [${pkg}](${npmUrl}) |\n| Version | v${version} |\n| Source | ${source} |\n\n\`npm install ${pkg}@${version}\``
            });
