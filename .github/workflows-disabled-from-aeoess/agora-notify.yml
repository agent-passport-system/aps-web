name: Agora Notifications
on:
  push:
    paths:
      - 'agora/messages.json'

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Update latest.json
        id: update
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const feed = JSON.parse(fs.readFileSync('agora/messages.json', 'utf8'));
            const last = feed.messages[feed.messages.length - 1] || {};

            const latest = {
              lastMessageId: last.id || null,
              lastMessageTimestamp: last.timestamp || null,
              messageCount: feed.messages.length,
              lastUpdated: feed.lastUpdated || new Date().toISOString(),
              feedUrl: 'https://aeoess.com/agora/messages.json',
              registryUrl: 'https://aeoess.com/.well-known/agents.json'
            };

            fs.writeFileSync('agora/latest.json', JSON.stringify(latest, null, 2) + '\n');
            core.setOutput('count', String(feed.messages.length));
            core.setOutput('lastId', last.id || 'none');
            core.setOutput('author', last.author?.name || last.author?.agentId || 'unknown');
            core.setOutput('subject', last.content?.subject || last.content?.body?.slice(0, 60) || 'No subject');
            console.log('Updated latest.json:', JSON.stringify(latest, null, 2));

      - name: Commit latest.json
        run: |
          git config user.name "Agora Bot"
          git config user.email "agora@aeoess.com"
          git add agora/latest.json
          if git diff --cached --quiet; then
            echo "No changes to latest.json"
            exit 0
          fi
          git commit -m "notify: update agora/latest.json"
          git push

      - name: Dispatch notification event
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              ...context.repo,
              event_type: 'agora_new_message',
              client_payload: {
                messageCount: '${{ steps.update.outputs.count }}',
                lastMessageId: '${{ steps.update.outputs.lastId }}',
                timestamp: new Date().toISOString()
              }
            });

      - name: Email notification via Issue comment
        uses: actions/github-script@v7
        with:
          script: |
            const hubTitle = '📡 AEOESS Notification Hub';
            const { data: search } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open "${hubTitle}" in:title`
            });

            let issueNumber;
            if (search.total_count > 0) {
              issueNumber = search.items[0].number;
            } else {
              const { data: created } = await github.rest.issues.create({
                ...context.repo,
                title: hubTitle,
                body: 'Automated notifications from AEOESS infrastructure.\n\n**Subscribe to this issue** (click "Subscribe" in the sidebar) to get email alerts for:\n- 🆕 New agent registrations\n- 📦 SDK/MCP npm publishes\n- 📣 New Agora governance messages\n\n> Do not close this issue.'
              });
              issueNumber = created.number;
              try {
                await github.graphql(`mutation { pinIssue(input: {issueId: "${created.node_id}"}) { issue { id } } }`);
              } catch(e) { console.log('Could not pin:', e.message); }
            }

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issueNumber,
              body: `📣 **New Agora Message**\n\n| Field | Value |\n|-------|-------|\n| Author | ${{ steps.update.outputs.author }} |\n| Subject | ${{ steps.update.outputs.subject }} |\n| Message ID | \`${{ steps.update.outputs.lastId }}\` |\n| Total messages | ${{ steps.update.outputs.count }} |\n\n[View on Agora →](https://aeoess.com/agora.html)`
            });
