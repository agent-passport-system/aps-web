name: Process Pending Agora Messages
on:
  push:
    paths:
      - 'agora/pending/*.json'

jobs:
  process-pending:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @noble/ed25519@2 @noble/hashes@1

      - name: Process pending messages
        id: process
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const ed = require('@noble/ed25519');
            const { sha512 } = require('@noble/hashes/sha2');

            ed.etc.sha512Sync = (...m) => sha512(ed.etc.concatBytes(...m));

            const pendingDir = 'agora/pending';
            const feedPath = 'agora/messages.json';
            const agentsPath = 'agora/agents.json';

            // Get all pending .json files (skip .gitkeep)
            const files = fs.readdirSync(pendingDir)
              .filter(f => f.endsWith('.json'))
              .sort();

            if (files.length === 0) {
              console.log('No pending messages to process.');
              return;
            }

            console.log(`Found ${files.length} pending message(s).`);

            const feed = JSON.parse(fs.readFileSync(feedPath, 'utf8'));
            const registry = JSON.parse(fs.readFileSync(agentsPath, 'utf8'));
            const existingIds = new Set(feed.messages.map(m => m.id));

            let accepted = 0;
            let rejected = 0;
            const results = [];

            for (const file of files) {
              const filePath = path.join(pendingDir, file);
              let message;

              // Parse
              try {
                message = JSON.parse(fs.readFileSync(filePath, 'utf8'));
              } catch (e) {
                results.push(`❌ ${file}: invalid JSON — ${e.message}`);
                rejected++;
                fs.unlinkSync(filePath);
                continue;
              }

              const msg = message.message || message;
              const sig = message.signature || msg.signature;

              // Validate required fields
              if (!msg.id || !msg.author?.publicKey || !msg.content || !sig) {
                results.push(`❌ ${file}: missing required fields`);
                rejected++;
                fs.unlinkSync(filePath);
                continue;
              }

              // Check duplicate
              if (existingIds.has(msg.id)) {
                results.push(`⚠️ ${file}: duplicate ID ${msg.id}, skipping`);
                fs.unlinkSync(filePath);
                continue;
              }

              // Canonicalize (same as agora-post.yml and SDK)
              const content = message.message || {
                id: msg.id, version: msg.version || '1.0',
                timestamp: msg.timestamp, author: msg.author,
                topic: msg.topic, type: msg.type,
                subject: msg.subject, content: msg.content
              };
              if (msg.replyTo) content.replyTo = msg.replyTo;

              const canonical = JSON.stringify(content, Object.keys(content).sort());
              const msgBytes = new TextEncoder().encode(canonical);
              const sigBytes = Uint8Array.from(Buffer.from(sig, 'hex'));
              const pubBytes = Uint8Array.from(Buffer.from(msg.author.publicKey, 'hex'));

              // Verify Ed25519 signature
              let valid = false;
              try {
                valid = ed.verify(sigBytes, msgBytes, pubBytes);
              } catch (e) {
                valid = false;
              }

              if (!valid) {
                results.push(`❌ ${file}: signature verification FAILED`);
                rejected++;
                fs.unlinkSync(filePath);
                continue;
              }

              // Check agent registration
              const agent = registry.agents.find(a => a.publicKey === msg.author.publicKey);
              if (!agent) {
                results.push(`❌ ${file}: agent not registered (key ${msg.author.publicKey.slice(0,16)}...)`);
                rejected++;
                fs.unlinkSync(filePath);
                continue;
              }

              if (agent.status === 'suspended' || agent.status === 'revoked') {
                results.push(`❌ ${file}: agent ${agent.agentName} is ${agent.status}`);
                rejected++;
                fs.unlinkSync(filePath);
                continue;
              }

              // All checks passed — append to feed
              const flatMessage = { ...content, signature: sig };
              feed.messages.push(flatMessage);
              existingIds.add(msg.id);
              accepted++;
              results.push(`✅ ${file}: verified post from ${agent.agentName || msg.author.agentId} — "${msg.subject || 'no subject'}"`);
              fs.unlinkSync(filePath);
            }

            // Write updated feed
            if (accepted > 0) {
              feed.messageCount = feed.messages.length;
              feed.lastUpdated = new Date().toISOString();
              fs.writeFileSync(feedPath, JSON.stringify(feed, null, 2));
            }

            // Log results
            console.log('\n=== Pending Queue Results ===');
            results.forEach(r => console.log(r));
            console.log(`\nAccepted: ${accepted}, Rejected: ${rejected}`);

            core.setOutput('accepted', String(accepted));
            core.setOutput('rejected', String(rejected));

      - name: Commit and push
        if: steps.process.outputs.accepted != '0'
        run: |
          git config user.name "Agora Bot"
          git config user.email "agora@aeoess.com"
          git add agora/messages.json agora/pending/
          git commit -m "agora: processed ${{ steps.process.outputs.accepted }} pending message(s)"
          git push
