- id: d185-mcp-500-amendment-lifecycle
  title: "MCP 5.0.0: a tool that reported a cryptographic verdict over an arithmetic check is removed"
  description: "evaluate_threshold took a charter id and signature records whose signature field defaulted to the empty string, then printed THRESHOLD MET. No amendment ever reached it, the server held no amendments, and the underlying function counted a signature without verifying it. Passing content was not the fix: the SDK keeps the amendment preimage private and exports verifyAmendment, which derives it internally, and the server already imported the lifecycle at one call site and used none of it. 5.0.0 removes the tool and ships propose_amendment, sign_amendment and verify_amendment in the governance profile, with the verdict reported field by field so a caller can see signatures verify while the threshold falls short. Two AST assertions hold the boundary: exactly two files may bind a canonicalization symbol, and the amendment handlers call no canonicalizer. Both negative-tested."
  status: done
  workstream: protocol
  day_start: 185
  day_end: 185
  links:
