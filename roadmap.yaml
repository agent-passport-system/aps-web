# ═══ DAY 120 — 2026-06-16 ═══

- id: d120-evidence-standard-doctrine-validator
  title: "Crosswalk registry gains an evidence standard for third-party claims, enforced by the validator"
  description: "The vocabulary contribution guide now governs how a crosswalk carries a claim about an outside system it did not author: a qualifier travels inseparably with the claim it qualifies, the claim is attributed to whoever verified it, publicly verifiable is the unmarked default while weaker bases are marked in the displayed cell value rather than a hidden sibling field, the described system keeps a standing low-friction right of reply, and a missing capability is recorded as what was searched and not found rather than asserted as a fact about the system. The validator backs the mechanical part: an expired reverify date with no fresh evidence fails the cell to a stale state, elapsed time never upgrades a cell, and negative fixtures that must fail run in their own pass and are asserted to fail so a clean production run stays meaningful."
  status: done
  workstream: vocabulary
  day_start: 120
  day_end: 120
