- id: d179-rust-sdk-published
  title: "Rust SDK published, verification only, with a README that states what a pass does not prove"
  description: "agent-passport-system 0.1.0 on crates.io, Apache-2.0, matching the npm and PyPI package names with the library importable as agent_passport. Verifies passports, delegations, chains and ReceiptV1 across both canonicalization profiles against frozen conformance vectors; creates nothing, with no key generation, signing or issuance. 101 tests, no unsafe code, dependency audit clean across 1216 advisories, and consumer resolution verified from a scratch project rather than from the working tree. The README states the limits: it does not implement the seven-facet authority record of the current draft, chain narrowing is pairwise and incomplete on spend and depth, signatures establish static limits and not consumed state, key admissibility is unchecked, and it is a fourth implementation by the same maintainer rather than independent verification."
