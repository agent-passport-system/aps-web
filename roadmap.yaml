# ═══ HISTORICAL KILLED ITEMS — restored from conversation record (added Day 64) ═══
# Philosophy: showing what we decided NOT to build is as much a PM signal as showing what shipped.
# Each killed item carries a kill_note surfaced in the roadmap tooltip.

- id: killed-forensic-attribution-test
  title: "Forensic attribution test (5-signal)"
  description: "Proposed Day 48. A five-signal test to detect whether an authorized trade was secretly colluding with a counterparty — checking ordering, size, timing, pricing, and trajectory against benign baselines. Would have produced a forensic score on every gateway-observed action."
  status: killed
  workstream: research
  day_start: 48
  day_end: 48
  dependencies:
    - multi-model-review-methodology
  kill_note: "Killed Day 48 multi-model architectural review. All four model reviewers (Claude, GPT-5, Gemini 2.5 Pro, plus a fourth adversarial Claude) independently designed an undetectable attacker class, legitimate-looking losing trades against colluding counterparties within per-transaction limits. The test catches naive attackers designed to be catchable and fails against adversarial-aware ones. Building it is a waste. Replaced by cumulative-exposure-tracking: enforce net position change per delegation per rolling window at the gateway, not behavioral forensics per action. 95% confidence kill."

- id: killed-cascade-verification
  title: "Cascade verification (supervisor chain)"
  description: "Proposed Day 48. Before every delegated action, walk the full delegation chain and require each supervisor in the chain to re-verify that the downstream action is still within scope. Intended to catch chained compromise through deep delegation trees."
  status: killed
  workstream: protocol
  day_start: 48
  day_end: 48
  dependencies:
    - multi-model-review-methodology
  kill_note: "Killed Day 48 own-team attack. Supervisors rubber-stamp clean history. Routing is attacker-controlled, so an attacker can present only the supervisors who will sign. UX kills adoption, every action blocks on N manual approvals. Fell apart on first red-team pass. Replaced by structural authority-class separation plus non-bypassable timelocks at action time, not trust-chain verification. 95% confidence kill."

- id: killed-quantum-inside-aps
  title: "Quantum computing inside APS"
  description: "Days 42-51. Six weeks of circling three framings for using quantum computing to strengthen APS itself: quantum speedup for delegation-chain math, quantum randomness for keygen, Bell-state non-collusion proofs between gateways. Each felt like it should work; none actually did."
  status: killed
  workstream: research
  day_start: 42
  day_end: 51
  dependencies:
    - multi-model-review-methodology
  kill_note: "Killed Day 51 multi-model architectural review. Quantum speedup for APS math: delegation verification is already microsecond-fast, no asymptotic win matters. Quantum randomness for keygen: modern CSPRNGs are commodity, a quantum source adds cost with no security delta. Bell-state non-collusion: cute, not useful, the threat model doesn't need entangled gateways. Correct reframing: put APS *around* quantum, not quantum inside APS. Shipped as Paper 5 (Physics-Enforced Delegation, Zenodo 10.5281/zenodo.19478584) governing quantum hardware physics via delegation facets. Six weeks of circling produced a Zenodo paper and an IBM experiment, just not the paper we set out to write."

