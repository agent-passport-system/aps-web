- id: d92-cosai-tool-registry-integrity
  title: "CoSAI tool-registry integrity: APS adds the missing four components"
  description: "OASIS Coalition for Secure AI has a control proposal in review (controlToolRegistryandDiscoveryIntegrity) covering integrity of tool registries, manifests, and discovery endpoints. APS already had signed registry entries and implementation-hash integrity. The cosai-tool-registry-integrity branch adds the other four required pieces: signed tool manifests with a distinct metadata hash, publisher identity verification against an external trust root or APS-native identity, namespace governance so a tool under a claimed namespace must be published by that namespace's owner, and re-approval bound to a resolved attestor identity (metadata change moves a manifest to pending, only a verifiable attestor can clear it). Each piece has tests including adversarial cases plus cross-language conformance vectors. APS offered as reference implementation for the CoSAI control proposal."
  status: in_progress
  workstream: standards
  day_start: 92
