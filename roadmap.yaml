- id: d179-port-defects-and-gate-reproduction
  title: "Five defects the port surfaced, and a review method that could not have found them"
  description: "A language with no undefined forces every absent value to be named. Non-string scope entries were silently dropped instead of rejected; fractional depths flowed through a float accessor so a chain of minus one point five to minus zero point five satisfied the increment rule; clock skew was unbounded with unchecked arithmetic on both boundaries; and a shipped test claiming to cover duplicate keys after escape decoding asserted the same literal twice. My own sign-off had reproduced the gates, which proves a gate ran and says nothing about semantics. Named and recorded as a distinct review failure mode."
  status: done
  workstream: conformance
  day_start: 179
  day_end: 179

- id: d179-narrowing-pairwise-gap
  title: "Chain narrowing is checked pairwise and skips when either side omits the field"
  description: "Each hop compares a child against the link immediately before it, and every comparison is guarded on both sides carrying the constraint. A link omitting a spend limit or depth ceiling removes the comparison rather than widening anything itself, so the descendant below is measured against nothing. Expiry already refuses this in both implementations, with the reasoning in the source comment. Three dimensions lack the rule. The specification already covers all of it: an unbounded child under a bounded parent is invalid, a missing facet is invalid rather than an implicit unconstrained value, depth decrements per hop, and child validity intervals are contained in their parent's. The gap is implementation, not specification, and the draft's implementation status appendix has stated the wire format lag in public since July."
  status: in_progress
  workstream: protocol
  day_start: 179

# ═══ DAY 178 - 2026-08-13 ═══

- id: d178-single-use-race-closed
  title: "A single-use guard that held sequentially and lost under concurrency, closed"
  description: "A type exported by the SDK carries a comment stating each approval can be used exactly once. The implementation behind it read the consumed flag, awaited a lock, then set the flag, with no re-read in between. Two concurrent dispatches against one approval both executed; the sequential control denied the second with the replay error, which is what makes it a race rather than a missing check. Closed by re-reading inside the serialized section, probe confirms two to one, full suite 522 passing across 163 suites. Severity calibrated rather than inflated: the path is reachable from no route, imported by no other file, and shipped in the public SDK only as a stub that throws. Defect real, exposure nil."
  status: done
  workstream: protocol
  day_start: 178
  day_end: 178

- id: d178-two-phase-claim-withdrawn
  title: "The enforcement path runs single-phase, so the two-phase claim comes off every surface"
  description: "The deployed configuration evaluates, returns a verdict, and commits spend in one step. The specified model where an approval is minted and then separately consumed before dispatch is not what runs. Recorded as a hard constraint on public language: nothing describes the enforcement here as two-phase, as issuing consumable approvals, or as preventing replay at dispatch, until it is built or the sentence changes. An implementation behind a coherent specification is an ordinary state; describing the gap as closed is not."
  status: in_progress
  workstream: protocol
  day_start: 178

- id: d178-scope-default-depth-unbounded
  title: "An unqualified parent scope authorizes arbitrarily deep descendants under the default interpretation"
  description: "Granting the scope code authorizes code:delete, code:exec and code:deploy:prod, with containment unbounded in depth, under the interpretation that applies when none is set. The reverse direction is correctly closed, so the matcher behaves as specified and the finding is about the default rather than a defect. Consequence for issuers: an unqualified parent scope is broader than it reads, and the effective attack is a request for something modest that already contains the target rather than a request for the target."
  status: done
  workstream: protocol
  day_start: 178
  day_end: 178

- id: d178-upstream-assignment-and-two-more-defects
  title: "Assigned upstream to the issue the open change implements, with two further defects closed"
  description: "A maintainer assigned the originating issue, so the implementation is carried rather than volunteered. Two more defects landed on top, both leaving a tool request with no response: a permission denial swallowed between an operation matcher recognising only one variant and a fallback reserving every active call, and two final-output calls in one block each treating the other as unfinished. Two narrowing conditions, 18 lines added across 2 files. The test asserts a bijection over the transcript, each request appearing once with exactly one response and no orphans, which is a stronger invariant than the four individual cases that exercise it."
  status: done
  workstream: contribution
  day_start: 178
