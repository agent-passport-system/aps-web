      label: "PR #6"

- id: d185-tool-count-generated
  title: "Tool count generated from the live registry instead of written by hand in five files"
  description: "150 to 152, and no longer a literal anywhere. Every registration passes through the server's own registerTool wrapper, so the manifest is collected there and the test asserts the runtime registry equals the manifest rather than equalling a number. The name is recorded before the wrapper's profile early return, because after it the manifest would silently become a function of whichever profile was active; a test asserts the manifest is identical under full and governance while the tools that actually land still differ, 152 against 37."
