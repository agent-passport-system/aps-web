# ═══ DAY 177 - 2026-08-12 ═══

- id: d177-dco-check-enabled-mid-review
  title: "A sign-off check went live mid-review, and the reasoning that dismissed it was wrong in a nameable way"
  description: "A DCO check appeared on an upstream repository partway through an open pull request. The first read looked at four recently merged pull requests, found no sign-off trailers, and concluded the check was not gating merges. Those pull requests had never been subject to it: the check was enabled that morning, an older commit on the same branch carries twenty-four check runs without it, and every instance found across the repository started the same day. Absence of a signal is not absence of a requirement when the check has not run. Four commits signed off, tree diffed before and after to confirm only trailers moved."
  status: done
  workstream: contribution
  day_start: 177
  day_end: 177

- id: d177-bilateral-corpus-round-two
  title: "A cross-implementation corpus reproduced completely, and the five findings were about what the vectors test"
  description: "Five token digests and lengths, five signatures against the issuer's live key set, eight receipt digests and eight expected error lists all reproduced by running the stated profile rather than reading the published table. The rotation seam held byte-identically against the copy archived a week earlier, recomputed independently from each end. The findings concern coverage rather than correctness: no not-before claim in any token, so the lower-bound vector only rejects for a runner reading sidecar metadata; a malformed key fixture that fails base58 decoding rather than the multicodec check its note describes; a differential policy claim the fixture cannot support without a stated policy; and an identifier that no longer commits to signer identity, proved by minting two signers over one body."
  status: done
  workstream: conformance
  day_start: 177
  day_end: 177

- id: d177-receipt-id-content-addressed
  title: "Receipt identifiers are content-addressed on both sides, and ours had been for a round without saying so"
  description: "The APS receipt identifier preimage excludes signatures, so two valid signers over the same body produce the same identifier. That is what makes wrong-signer separable from tampered-content, and it also means the identifier names unsigned receipt content rather than a signer-bound object. It matters anywhere the identifier is used for deduplication, as a database key, as a reference, or as a revocation target. Recorded as a fourth place the two profiles differ, and flagged for the next draft revision, which currently says nothing either way."
  status: done
  workstream: protocol
  day_start: 177
  day_end: 177

- id: d177-site-certificate-bridge
  title: "The canonical domain's certificate would not reissue, so it now terminates at an edge certificate while the host clears the authorization"
  description: "The certificate expired and the host-side authorization state stayed bad through a domain detach and re-add at three wait intervals and through deleting and recreating the site. Everything checkable was clean: records identical across four public resolvers and the authoritative nameservers, no certificate authority restriction at the apex, the challenge path reachable and unredirected, and a second domain on the same account holding a valid certificate throughout. The domain now serves from an edge certificate as a bridge, with the redirect setting that caused the original interception left off so the host can complete its order. Twenty-five hours down."
  status: done
  workstream: infrastructure
  day_start: 177
  day_end: 177

